# Security headers for the website's own responses (pages, scripts, styles, images).
# Included in every location of nginx.conf.template except /api (the API sends its own, stricter headers).
# nginx drops server-level add_header lines inside a location that has its own, hence this shared file.
#
# Content-Security-Policy: only this site's own code runs; no inline scripts, no eval.
#   style-src / font-src: Google Fonts (index.html).
#   img-src: data: and blob: are the photo previews made in the browser (photo cropper, bulk upload);
#            res.cloudinary.com and i.pinimg.com are the hero and About images that are still hot-linked
#            (audit FE-02). Remove both hosts once those images are moved into public/images.
#   connect-src 'self': the API is on the same domain (nginx forwards /api).
# Checked by `npm run check:csp` (tests/csp/csp.spec.js reads this exact policy from this file).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://res.cloudinary.com https://i.pinimg.com; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# HSTS only when the visitor reached us over HTTPS (Coolify's proxy terminates TLS and sets
# X-Forwarded-Proto). Over plain HTTP the value is empty and nginx sends no header at all.
add_header Strict-Transport-Security $salvex_hsts always;
