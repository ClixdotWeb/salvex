# Continuous integration: every push and pull request runs the frontend lint + production build and the
# backend tests. Nothing here deploys anything or touches any real database: the backend job starts its
# own throwaway PostgreSQL service whose name contains "test" (the test suite refuses any other database).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, production build, security policy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: The production build must not contain the developer demo screens
        run: npm run check:no-demo
      - name: Browser for the security-policy check
        run: npx playwright install --with-deps chromium
      - name: The website's Content-Security-Policy does not block anything the site needs
        run: npm run check:csp

  backend:
    name: Backend (tests on a throwaway PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_only_not_a_secret
          POSTGRES_DB: salvex_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:ci_only_not_a_secret@localhost:5432/salvex_test_db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Known vulnerabilities in the production Python packages (pip-audit)
        # Fails on any known vulnerability, except the starlette ones below. Those were reviewed on
        # 2026-11-23 (PRODUCTION_READINESS_AUDIT.md, SEC-04): they need FastAPI >= a version on
        # starlette 1.3.1, and the affected features are not used by this API (no FileResponse,
        # StaticFiles, form or multipart parsing, HTTPEndpoint; security checks read scope["path"]).
        # Remove each exception when FastAPI/starlette is upgraded.
        run: >-
          pip-audit -r requirements.txt --progress-spinner off
          --ignore-vuln PYSEC-2026-1941 --ignore-vuln PYSEC-2026-1942 --ignore-vuln PYSEC-2026-161
          --ignore-vuln PYSEC-2026-2280 --ignore-vuln PYSEC-2026-2281 --ignore-vuln PYSEC-2026-248
          --ignore-vuln PYSEC-2026-249
      - name: Known vulnerabilities in the test tools (report only)
        continue-on-error: true
        run: pip-audit -r requirements-dev.txt --progress-spinner off
      - name: Create the test database schema (migrations)
        # The migration tool reads DATABASE_URL, so it is set for this one step only. The test run below
        # must not have it set (the safety guard refuses a test database equal to the "development" one).
        env:
          APP_ENV: test
          APP_SECRET_KEY: ci_only_secret_key_not_used_anywhere_else_0123456789
          FRONTEND_ORIGINS: http://localhost:5173
          DATABASE_URL: postgresql+asyncpg://postgres:ci_only_not_a_secret@localhost:5432/salvex_test_db
        run: alembic upgrade head
      - name: Backend tests
        run: python -m pytest -q -p no:cacheprovider
